<script>
// Net worth chart (Step 4) needs Chart.js, loaded from a CDN — the one thing on
// this page that needs internet. A single CDN can be blocked by a firewall, an
// ad-blocker, or a regional outage even when the rest of the internet works, so
// this tries three different CDNs in sequence and only gives up if all three
// fail. window.chartLoadPromise resolves true as soon as one succeeds, or false
// once all three have failed — the chart code (in the main script below) awaits
// this instead of assuming Chart.js is ready immediately.
window.loadChartJs = function () {
  var sources = [
    "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js",
    "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js",
    "https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js"
  ];
  return new Promise(function (resolve) {
    var i = 0;
    function tryNext() {
      if (i >= sources.length) { resolve(false); return; }
      var s = document.createElement("script");
      s.src = sources[i++];
      s.onload = function () { resolve(true); };
      s.onerror = function () { tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
};
window.chartLoadPromise = window.loadChartJs();
</script>
<style>

    --paper: #F5F6F2;
    --surface: #FFFFFF;
    --ink: #1C2B24;
    --ink-soft: #55645C;
    --ink-faint: #8B958E;
    --line: #D8DCD4;
    --jade: #1F7A5C;
    --jade-soft: #E3F1EA;
    --slate: #2A5C8A;
    --slate-soft: #E4EDF5;
    --brick: #A8402F;
    --brick-soft: #F6E3E0;
    --amber: #8A6D1D;
    --amber-soft: #FBF1D6;
    --step-off: #C7CCC3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 96px;
  }

  header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  header p {
    color: var(--ink-soft);
    margin: 0 0 32px;
    font-size: 15px;
  }

  /* ---------- Layout: sticky 2-column on wide screens ---------- */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 28px;
    align-items: start;
  }

  .steps-col { min-width: 0; }

  .result-rail {
    position: sticky;
    top: 20px;
  }

  .desktop-only { display: block; }
  .mobile-only { display: none; }

  @media (max-width: 900px) {
    .layout { display: block; }
    .result-rail { position: static; margin-top: 0; }
    .desktop-only { display: none; }
    .mobile-only { display: block; }
  }

  section.step {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 28px;
    margin-bottom: 20px;
  }

  .step-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .step-num {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--jade-soft);
    color: var(--jade);
    font-weight: 800;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }

  .step-head h2 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }

  label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  label .unit-hint {
    font-weight: 500;
    color: var(--ink-faint);
    font-size: 12.5px;
  }

  .field { margin-bottom: 18px; }

  select, input[type="number"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
  }

  select:focus, input:focus {
    outline: 2px solid var(--jade);
    outline-offset: 1px;
    border-color: var(--jade);
  }

  .hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 160px; }

  button {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #0f1a14; }
  .btn-primary:disabled { background: var(--step-off); cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

  .btn-sm { padding: 6px 14px; font-size: 13px; }

  /* ---------- Step 2: BUY / RENT columns ---------- */
  .unit-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 640px) {
    .unit-columns { grid-template-columns: 1fr; }
  }

  .unit-col-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .unit-col-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .unit-col-title.buy-tag { color: var(--jade); }
  .unit-col-title.rent-tag { color: var(--slate); }

  .sort-select {
    width: auto;
    padding: 6px 10px;
    font-size: 12.5px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 480px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .listing-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    background: var(--surface);
    transition: border-color 0.1s, background 0.1s;
  }
  .listing-card:hover { border-color: var(--jade); }
  .listing-card.selected {
    border-color: var(--jade);
    background: var(--jade-soft);
  }
  .unit-col[data-kind="rent"] .listing-card.selected {
    border-color: var(--slate);
    background: var(--slate-soft);
  }

  .listing-name { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
  .listing-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; }
  .listing-address { font-size: 12px; color: var(--ink-faint); line-height: 1.4; }

  .empty-state, .preview-placeholder {
    padding: 18px 14px;
    color: var(--ink-soft);
    font-size: 13.5px;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  /* ---------- Selected-unit summary (after both chosen) ---------- */
  .selected-summary {
    border: 1px solid var(--jade);
    background: var(--jade-soft);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .unit-col[data-kind="rent"] .selected-summary {
    border-color: var(--slate);
    background: var(--slate-soft);
  }
  .selected-summary .info { min-width: 0; }
  .selected-summary .listing-name { margin-bottom: 4px; }

  /* ---------- Result cards ---------- */
  .results-cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 16px;
  }

  .result-card {
    border-radius: 10px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .result-card.win { border-color: var(--jade); background: var(--jade-soft); }
  .result-card.win.rent-win { border-color: var(--slate); background: var(--slate-soft); }
  .result-card.fail { background: var(--brick-soft); border-color: var(--brick); }

  .result-card h3 {
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .stat-line {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13.5px;
    padding: 4px 0;
  }
  .stat-line .stat-label { color: var(--ink-soft); }
  .stat-line .stat-value { font-weight: 700; text-align: right; }

  .error-text { font-size: 13.5px; line-height: 1.5; }

  .margin-bar { margin-top: 10px; }
  .margin-bar-track {
    position: relative;
    height: 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.08);
    overflow: visible;
    margin-bottom: 6px;
  }
  .margin-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--jade);
  }
  .margin-bar-fill.unsafe { background: var(--brick); }
  .margin-bar-threshold {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 14px;
    background: var(--ink);
    opacity: 0.55;
  }
  .margin-bar-caption {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 2px 10px;
  }

  /* ---------- Decision banner ---------- */
  .verdict {
    padding: 16px 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }
  .verdict.win-buy { background: var(--jade); color: #fff; }
  .verdict.win-rent { background: var(--slate); color: #fff; }
  .verdict.fail { background: var(--brick); color: #fff; }
  .verdict .verdict-reason {
    display: block;
    font-weight: 500;
    font-size: 13px;
    margin-top: 4px;
    opacity: 0.9;
  }

  .error-banner {
    background: var(--brick-soft);
    border: 1px solid var(--brick);
    color: var(--brick);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }

  /* ---------- Chart + disclaimer ---------- */
  .chart-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px 8px;
    margin-bottom: 18px;
    background: var(--surface);
  }
  .chart-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
  }
  .chart-wrap { position: relative; height: 300px; margin-top: 10px; }

  .disclaimer {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 12px;
    color: var(--amber);
    background: var(--amber-soft);
    border: 1px solid #E3D18E;
    border-radius: 8px;
    padding: 10px 12px;
    line-height: 1.5;
    margin: 10px 0 6px;
  }
  .disclaimer .icon { flex-shrink: 0; }

  /* ---------- Result rail (sticky / mobile inline preview) ---------- */
  .preview-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  .preview-card h4 {
    margin: 0 0 14px;
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
  }
  .preview-block { margin-bottom: 14px; }
  .preview-label { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
  .preview-value { font-size: 14px; font-weight: 700; }
  .preview-hint { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .mini-card {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .mini-card .tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }
  .mini-card .name { font-size: 13.5px; font-weight: 700; margin: 2px 0; }
  .mini-card .price { font-size: 13px; color: var(--ink-soft); }

  .mobile-only.preview-card { margin: -4px 0 20px; }
</style>
</head>

<div class="shell">
  <header>
    <h1>FinFlow — Buy vs Rent</h1>
    <p>Compare the true cost of buying vs renting an apartment in Cau Giay — demo</p>
  </header>

  <div id="global-error" class="error-banner" style="display:none;"></div>

  <div class="layout">
    <main class="steps-col">

      <!-- STEP 1 -->
      <section class="step" id="step1">
        <div class="step-head"><div class="step-num">1</div><h2>Select area &amp; size</h2></div>

        <div class="row">
          <div class="field">
            <label for="ward_old">Ward (old)</label>
            <select id="ward_old"></select>
          </div>
          <div class="field">
            <label for="size_band">Size</label>
            <select id="size_band">
              <option value="Small">Small (45–59 m²)</option>
              <option value="Medium" selected>Medium (60–79 m²)</option>
              <option value="Large">Large (80–100 m²)</option>
            </select>
          </div>
        </div>
      </section>

      <div class="result-preview-mount mobile-only preview-card"></div>

      <!-- STEP 2 -->
      <section class="step" id="step2">
        <div class="step-head"><div class="step-num">2</div><h2>Choose a BUY unit and a RENT unit</h2></div>

        <div class="unit-columns">
          <div class="unit-col" data-kind="buy" id="buy-col">
            <div class="unit-col-head">
              <span class="unit-col-title buy-tag">Buy</span>
              <select class="sort-select" id="buy-sort">
                <option value="price_asc">Price: Low → High</option>
                <option value="price_desc">Price: High → Low</option>
                <option value="name_asc">Name: A → Z</option>
                <option value="name_desc">Name: Z → A</option>
                <option value="area_desc">Area: Large → Small</option>
                <option value="area_asc">Area: Small → Large</option>
              </select>
            </div>
            <div id="buy-list-wrap"></div>
          </div>

          <div class="unit-col" data-kind="rent" id="rent-col">
            <div class="unit-col-head">
              <span class="unit-col-title rent-tag">Rent</span>
              <select class="sort-select" id="rent-sort">
                <option value="price_asc">Price: Low → High</option>
                <option value="price_desc">Price: High → Low</option>
                <option value="name_asc">Name: A → Z</option>
                <option value="name_desc">Name: Z → A</option>
                <option value="area_desc">Area: Large → Small</option>
                <option value="area_asc">Area: Small → Large</option>
              </select>
            </div>
            <div id="rent-list-wrap"></div>
          </div>
        </div>
      </section>

      <div class="result-preview-mount mobile-only preview-card"></div>

      <!-- STEP 3 -->
      <section class="step" id="step3">
        <div class="step-head"><div class="step-num">3</div><h2>Financial profile</h2></div>

        <div class="row">
          <div class="field">
            <label for="income1">Income 1 <span class="unit-hint">(million VND / month)</span></label>
            <input type="number" id="income1" min="0" step="any" placeholder="e.g. 25">
          </div>
          <div class="field">
            <label for="income2">Income 2 <span class="unit-hint">(million VND / month)</span></label>
            <input type="number" id="income2" min="0" step="any" placeholder="e.g. 15">
          </div>
        </div>

        <div class="field">
          <label for="savings">Savings <span class="unit-hint">(million VND)</span></label>
          <input type="number" id="savings" min="0" step="any" placeholder="e.g. 2000">
        </div>

        <div class="row">
          <div class="field">
            <label for="living_cost">Minimum living cost <span class="unit-hint">(million VND / month)</span></label>
            <input type="number" id="living_cost" min="0" step="any" placeholder="e.g. 8">
          </div>
          <div class="field">
            <label for="existing_debt">Existing debt <span class="unit-hint">(million VND / month)</span></label>
            <input type="number" id="existing_debt" min="0" step="any" value="0">
            <div class="hint">Leave as 0 if you have no other debt payments.</div>
          </div>
        </div>

        <div class="field">
          <label for="loan_term_months">Loan term <span class="unit-hint">(months)</span></label>
          <input type="number" id="loan_term_months" min="1" step="1" value="360">
        </div>

        <button class="btn-primary" id="calculate-btn" disabled>Calculate</button>
        <div class="hint" id="calculate-hint" style="margin-top:10px;">Select a BUY and a RENT unit in Step 2 first.</div>
      </section>

      <!-- STEP 4 -->
      <section class="step" id="step4" style="display:none;">
        <div class="step-head"><div class="step-num">4</div><h2>Result</h2></div>
        <div id="results-area"></div>
      </section>

    </main>

    <aside class="result-rail desktop-only">
      <div class="result-preview-mount preview-card"></div>
    </aside>
  </div>
</div>

// ============================================================
// FIN_ASSUMPTIONS + calculation engine — ported line-for-line from
// loan_calc.py / evaluate.py (same formulas, same thresholds, same English
// messages) so results match the Python version exactly.
// ============================================================
const FIN_ASSUMPTIONS = {
  interest_rate_promo_pct: 8.3,
  promo_period_months: 12,
  interest_rate_float_ref_pct: 8.3,
  float_rate_margin_year1_pct: 1.5,
  float_rate_margin_from_year2_pct: 3.5,
  grace_period_months: 24,
  max_loan_to_value_pct: 80,
  Loan_term_months: 360,
  investment_return_pct: 6,
  property_annual_appreciation_pct: 12,
};

function formatIntWithCommas(n) {
  return Math.round(n).toLocaleString("en-US");
}

function getMonthlyRatePct(t, assumptions) {
  const promoPeriod = assumptions.promo_period_months;
  if (t <= promoPeriod) return assumptions.interest_rate_promo_pct;
  if (t <= promoPeriod + 12) {
    return assumptions.interest_rate_float_ref_pct + assumptions.float_rate_margin_year1_pct;
  }
  return assumptions.interest_rate_float_ref_pct + assumptions.float_rate_margin_from_year2_pct;
}

// Muc 5 (Method A, declining balance) + muc 6 (Net worth BUY — extends this
// SAME loop, no separate loop) — ported from loan_calc.py's loan_calc().
function loanCalc(purchasePrice, savings, loanTermMonths, assumptions, netWorthInputs) {
  assumptions = assumptions || FIN_ASSUMPTIONS;
  loanTermMonths = loanTermMonths || assumptions.Loan_term_months;

  const computeNetWorth = !!netWorthInputs;
  let monthlyInvestRate = null;
  let propertyAppreciationPct = null;
  if (computeNetWorth) {
    const investmentReturnPct = assumptions.investment_return_pct;
    propertyAppreciationPct = assumptions.property_annual_appreciation_pct;
    if (investmentReturnPct == null || propertyAppreciationPct == null) {
      throw new Error("assumptions is missing investment_return_pct or property_annual_appreciation_pct");
    }
    monthlyInvestRate = investmentReturnPct / 100 / 12;
  }

  const maxLtvPct = assumptions.max_loan_to_value_pct;
  const gracePeriod = assumptions.grace_period_months;
  const minDownPayment = purchasePrice * (1 - maxLtvPct / 100);

  if (savings < minDownPayment) {
    const shortfall = minDownPayment - savings;
    return {
      min_down_payment: minDownPayment,
      required_loan: null,
      error: `You need at least ${formatIntWithCommas(shortfall)} more in savings to qualify for this loan (max LTV ${maxLtvPct}%).`,
      schedule: [],
    };
  }

  const requiredLoan = purchasePrice - savings;
  const remainingPrincipalMonths = loanTermMonths - gracePeriod;
  if (remainingPrincipalMonths <= 0) {
    return {
      min_down_payment: minDownPayment,
      required_loan: requiredLoan,
      error: "grace_period_months must be less than Loan_term_months (invalid input).",
      schedule: [],
    };
  }

  const fixedPrincipalPayment = requiredLoan / remainingPrincipalMonths;
  const schedule = [];
  let outstandingBalanceStart = requiredLoan;
  let investedBalanceBuy = 0.0; // Invested_balance_BUY(0) = 0 (muc 6)

  for (let t = 1; t <= loanTermMonths; t++) {
    const ratePct = getMonthlyRatePct(t, assumptions);
    const monthlyRate = (ratePct / 100) / 12;
    const balanceStart = outstandingBalanceStart;

    let principalPayment, interestPayment, balanceEnd;
    if (t <= gracePeriod) {
      principalPayment = 0.0;
      interestPayment = balanceStart * monthlyRate;
      balanceEnd = balanceStart;
    } else {
      principalPayment = fixedPrincipalPayment;
      interestPayment = balanceStart * monthlyRate;
      balanceEnd = balanceStart - principalPayment;
    }

    const monthlyRepayment = principalPayment + interestPayment;

    const row = {
      month: t,
      annual_rate_pct: ratePct,
      balance_start: balanceStart,
      principal_payment: principalPayment,
      interest_payment: interestPayment,
      monthly_repayment: monthlyRepayment,
      balance_end: balanceEnd,
    };

    if (computeNetWorth) {
      const { income1, income2, livingCost, existingDebt } = netWorthInputs;
      const moneyRemainingBuy = income1 + income2 - livingCost - existingDebt - monthlyRepayment;
      investedBalanceBuy = investedBalanceBuy * (1 + monthlyInvestRate) + moneyRemainingBuy;
      const propertyValue = purchasePrice * Math.pow(1 + propertyAppreciationPct / 100, t / 12);
      const netWorthBuy = propertyValue - balanceEnd + investedBalanceBuy;

      row.money_remaining_buy = moneyRemainingBuy;
      row.invested_balance_buy = investedBalanceBuy;
      row.property_value = propertyValue;
      row.net_worth_buy = netWorthBuy;
    } else {
      row.money_remaining_buy = null;
      row.invested_balance_buy = null;
      row.property_value = null;
      row.net_worth_buy = null;
    }

    schedule.push(row);
    outstandingBalanceStart = balanceEnd;
  }

  return { min_down_payment: minDownPayment, required_loan: requiredLoan, error: null, schedule };
}

// Muc 4: bang safety_margin_min_pct theo tier thu nhap ho.
function getSafetyMarginMinPct(totalIncome) {
  const trieu = totalIncome / 1_000_000;
  if (trieu < 35) return 0.40;
  if (trieu < 50) return 0.35;
  if (trieu < 75) return 0.30;
  return 0.25;
}

// Muc 5 — ported from evaluate.py's evaluate_buy(). Always passes the
// financial inputs into loanCalc() so the SAME call also produces the full
// Net worth BUY series (muc 6) — never calls loanCalc() a second time.
function evaluateBuy(buyListing, income1, income2, savings, livingCost, existingDebt, loanTermMonths, month, assumptions) {
  existingDebt = existingDebt || 0;
  month = month || 1;
  const purchasePrice = buyListing.total_price_vnd;
  const totalIncome = income1 + income2;

  const loanResult = loanCalc(purchasePrice, savings, loanTermMonths, assumptions, {
    income1, income2, livingCost, existingDebt,
  });

  if (loanResult.error !== null) {
    return {
      error: loanResult.error,
      min_down_payment: loanResult.min_down_payment,
      required_loan: null,
      monthly_repayment: null,
      money_remaining: null,
      safety_margin: null,
      safety_margin_min_pct: getSafetyMarginMinPct(totalIncome),
      is_safe: null,
      net_worth_series: null,
    };
  }

  const monthRow = loanResult.schedule.find(r => r.month === month);
  const monthlyRepayment = monthRow.monthly_repayment;
  const moneyRemaining = income1 + income2 - livingCost - existingDebt - monthlyRepayment;
  const safetyMargin = moneyRemaining / totalIncome;
  const minPct = getSafetyMarginMinPct(totalIncome);
  const isSafe = safetyMargin >= minPct;
  const netWorthSeries = loanResult.schedule.map(r => ({ month: r.month, net_worth_buy: r.net_worth_buy }));

  return {
    error: null,
    min_down_payment: loanResult.min_down_payment,
    required_loan: loanResult.required_loan,
    monthly_repayment: monthlyRepayment,
    money_remaining: moneyRemaining,
    safety_margin: safetyMargin,
    safety_margin_min_pct: minPct,
    is_safe: isSafe,
    net_worth_series: netWorthSeries,
  };
}

// Muc 8 — ported from evaluate.py's evaluate_rent() (point-in-time safety margin).
function evaluateRent(rentListing, income1, income2, savings, livingCost, existingDebt) {
  existingDebt = existingDebt || 0;
  const monthlyRent = rentListing.rent_monthly_vnd;
  const totalIncome = income1 + income2;
  const moneyRemaining = income1 + income2 - livingCost - existingDebt - monthlyRent;
  const safetyMargin = moneyRemaining / totalIncome;
  const minPct = getSafetyMarginMinPct(totalIncome);
  const isSafe = safetyMargin >= minPct;
  return {
    monthly_rent: monthlyRent,
    money_remaining: moneyRemaining,
    safety_margin: safetyMargin,
    safety_margin_min_pct: minPct,
    is_safe: isSafe,
  };
}

// Muc 6 (RENT side) — closed-form, ported from evaluate.py.
function calcMoneyRemainingRent(rentListing, income1, income2, livingCost, existingDebt) {
  existingDebt = existingDebt || 0;
  const monthlyRent = rentListing.rent_monthly_vnd;
  return income1 + income2 - livingCost - existingDebt - monthlyRent;
}

function netWorthRentAt(t, savings, moneyRemainingRent, investmentReturnPct) {
  const r = investmentReturnPct / 100 / 12;
  const growth = Math.pow(1 + r, t);
  if (r === 0) return savings + moneyRemainingRent * t;
  return savings * growth + moneyRemainingRent * ((growth - 1) / r);
}

function netWorthRentSchedule(rentListing, income1, income2, savings, livingCost, existingDebt, loanTermMonths, assumptions) {
  assumptions = assumptions || FIN_ASSUMPTIONS;
  loanTermMonths = loanTermMonths || assumptions.Loan_term_months;
  const investmentReturnPct = assumptions.investment_return_pct;
  if (investmentReturnPct == null) throw new Error("assumptions is missing investment_return_pct");
  const moneyRemainingRent = calcMoneyRemainingRent(rentListing, income1, income2, livingCost, existingDebt);
  const out = [];
  for (let t = 1; t <= loanTermMonths; t++) {
    out.push({ month: t, net_worth_rent: netWorthRentAt(t, savings, moneyRemainingRent, investmentReturnPct) });
  }
  return out;
}

// Muc 6 — break-even, ported from evaluate.py's find_break_even().
function findBreakEven(netWorthBuySeries, netWorthRentSeries) {
  if (!netWorthBuySeries || !netWorthRentSeries) return [null, null];
  const rentByMonth = new Map(netWorthRentSeries.map(r => [r.month, r.net_worth_rent]));
  let prevDiff = null;
  for (const row of netWorthBuySeries) {
    const m = row.month;
    if (!rentByMonth.has(m)) continue;
    const diff = row.net_worth_buy - rentByMonth.get(m);
    if (prevDiff !== null && prevDiff !== 0 && diff !== 0) {
      const crossed = (prevDiff < 0 && diff > 0) || (prevDiff > 0 && diff < 0);
      if (crossed) return [m, Math.round(m / 12)];
    } else if (prevDiff !== null && diff === 0) {
      return [m, Math.round(m / 12)];
    }
    prevDiff = diff;
  }
  return [null, null];
}

// Muc 10 — decision priority, ported from evaluate.py's decide().
function decide(buyResult, rentResult) {
  const buySafe = buyResult.is_safe;
  const rentSafe = rentResult.is_safe;

  if (buyResult.error !== null) {
    if (rentSafe) return ["RENT", "BUY not viable due to insufficient savings — RENT meets the safety threshold."];
    return ["NEITHER", "BUY not viable due to insufficient savings, and RENT also does not meet the safety threshold."];
  }

  const buyMargin = buyResult.safety_margin;
  const rentMargin = rentResult.safety_margin;

  if (rentSafe && rentMargin > buyMargin) return ["RENT", "RENT meets the safety threshold and has a higher safety margin than BUY."];
  if (buySafe) return ["BUY", "BUY meets the safety threshold."];
  if (rentSafe) return ["RENT", "RENT meets the safety threshold (BUY does not)."];
  return ["NEITHER", "Neither BUY nor RENT meets the safety threshold."];
}

// Ported from evaluate.py's evaluate_buy_vs_rent().
function evaluateBuyVsRent(buyListing, rentListing, income1, income2, savings, livingCost, existingDebt, loanTermMonths, month, assumptions) {
  existingDebt = existingDebt || 0;
  month = month || 1;
  assumptions = assumptions || FIN_ASSUMPTIONS;
  loanTermMonths = loanTermMonths || assumptions.Loan_term_months;

  const buyResult = evaluateBuy(buyListing, income1, income2, savings, livingCost, existingDebt, loanTermMonths, month, assumptions);
  const rentResult = evaluateRent(rentListing, income1, income2, savings, livingCost, existingDebt);
  const [decision, reason] = decide(buyResult, rentResult);

  const rentNetWorthSeries = netWorthRentSchedule(rentListing, income1, income2, savings, livingCost, existingDebt, loanTermMonths, assumptions);
  const [breakEvenMonth, breakEvenYear] = findBreakEven(buyResult.net_worth_series, rentNetWorthSeries);

  return {
    buy: buyResult,
    rent: rentResult,
    decision,
    reason,
    net_worth: {
      buy_series: buyResult.net_worth_series,
      rent_series: rentNetWorthSeries,
      break_even_month: breakEvenMonth,
      break_even_year: breakEvenYear,
    },
  };
}

// Muc 6 — sample the two monthly series into yearly points, ported from app.py's
// build_net_worth_timeline(). Last point always lands exactly on loanTermMonths.
function buildNetWorthTimeline(netWorth, loanTermMonths) {
  const buySeries = netWorth.buy_series;
  const rentSeries = netWorth.rent_series;
  const buyByMonth = buySeries ? new Map(buySeries.map(r => [r.month, r.net_worth_buy])) : new Map();
  const rentByMonth = rentSeries ? new Map(rentSeries.map(r => [r.month, r.net_worth_rent])) : new Map();

  const numYears = Math.ceil(loanTermMonths / 12);
  const timeline = [];
  for (let year = 1; year <= numYears; year++) {
    const month = Math.min(year * 12, loanTermMonths);
    timeline.push({
      year,
      net_worth_buy: buyByMonth.has(month) ? buyByMonth.get(month) : null,
      net_worth_rent: rentByMonth.has(month) ? rentByMonth.get(month) : null,
    });
  }
  return timeline;
}

// ============================================================
// Client-side MUA_CALC / THUE_CALC / get_unique_wards — ported from
// mua_thue_calc.py, filtering the embedded arrays instead of an xlsx file.
// ============================================================
function muaCalc(wardOld, sizeBand, bedrooms) {
  bedrooms = bedrooms == null ? 2.0 : bedrooms;
  return BUY_LISTINGS.filter(r => r.ward_old === wardOld && r.size_band === sizeBand && Number(r.bedrooms) === bedrooms);
}
function thueCalc(wardOld, sizeBand, bedrooms) {
  bedrooms = bedrooms == null ? 2.0 : bedrooms;
  return RENT_LISTINGS.filter(r => r.ward_old === wardOld && r.size_band === sizeBand && Number(r.bedrooms) === bedrooms);
}
function getUniqueWardsLocal() {
  const wards = new Set();
  for (const r of BUY_LISTINGS) if (r.ward_old) wards.add(r.ward_old);
  for (const r of RENT_LISTINGS) if (r.ward_old) wards.add(r.ward_old);
  return Array.from(wards).sort();
}

// ---------- Formatting helpers (muc 3, muc 6) ----------
function formatVND(n) {
  return new Intl.NumberFormat("en-US").format(Math.round(n)) + " VND";
}
function formatPct(x) {
  return (x * 100).toFixed(2) + "%";
}
function formatBillionVND(vnd) {
  return (vnd / 1e9).toFixed(1) + "B VND";
}
function formatPricePerM2(vndPerM2) {
  return (vndPerM2 / 1e6).toFixed(2) + "M/m²";
}
function formatMillionPerMonth(vnd) {
  return (vnd / 1e6).toFixed(1) + "M VND/month";
}
function formatBeltway(zone) {
  return zone ? zone.replace("-", "–") : null;
}
function formatCount(n) {
  return Math.round(Number(n));
}
function formatBillionShort(vnd) {
  return (vnd / 1e9).toFixed(1) + "B";
}
function showError(message) {
  const el = document.getElementById("global-error");
  el.textContent = message;
  el.style.display = "block";

}
function clearError() {
  document.getElementById("global-error").style.display = "none";
}

// ---------- STEP 1 — wards / size_band (now fully local, no fetch) ----------
function loadWards() {
  const select = document.getElementById("ward_old");
  try {
    state.wards = getUniqueWardsLocal();
    select.innerHTML = "";
    state.wards.forEach(w => {
      const opt = document.createElement("option");

      opt.textContent = w;
      select.appendChild(opt);
    });

}

});
document.getElementById("size_band").addEventListener("change", (e) => {

// ---------- STEP 2 — listings, sort, selection (now fully local) ----------
function loadListings() {
  if (!state.ward_old || !state.size_band) return;
  try {
    state.buyListings = muaCalc(state.ward_old, state.size_band);
    state.rentListings = thueCalc(state.ward_old, state.size_band);
    renderUnitColumn("buy");
    renderUnitColumn("rent");
    updateAllPreviews();
  } catch (e) {
    showError("Could not load listings (" + e.message + "). Please reload this page.");
  }
}

function sortListings(listings, sortKey, priceField) {
  const arr = listings.slice();
  const [field, dir] = sortKey.split("_");
  arr.sort((a, b) => {
    let av, bv;
    if (field === "price") { av = a[priceField]; bv = b[priceField]; }
    else if (field === "name") { av = a.project_name.toLowerCase(); bv = b.project_name.toLowerCase(); }
    else if (field === "area") { av = a.area_m2; bv = b.area_m2; }
    if (av < bv) return dir === "asc" ? -1 : 1;
    if (av > bv) return dir === "asc" ? 1 : -1;
    return 0;
  });
  return arr;
}

function buildAddressLine(item) {
  const beltway = formatBeltway(item.beltway_zone);
  let line = `${item.address_street} Street, ${item.ward_old} Ward, ${item.district_old} District, Hanoi (${item.ward_2025} Ward, New Hanoi)`;
  if (beltway) line += ` · Beltway ${beltway}`;
  return line;
}

function buildCardMeta(item, kind) {
  const parts = [];
  if (kind === "buy") {
    parts.push(formatBillionVND(item.total_price_vnd));
    parts.push(`${item.area_m2} m²`);
    parts.push(formatPricePerM2(item.price_m2_vnd));
  } else {
    parts.push(formatMillionPerMonth(item.rent_monthly_vnd));
    parts.push(`${item.area_m2} m²`);
  }
  parts.push(`${formatCount(item.bedrooms)} 🛏`);
  if (item.bathrooms !== null && item.bathrooms !== undefined) {
    parts.push(`${formatCount(item.bathrooms)} 🚿`);
  }
  return parts.join(" · ");
}

function renderUnitColumn(kind) {
  const wrap = document.getElementById(kind + "-list-wrap");
  const listings = kind === "buy" ? state.buyListings : state.rentListings;
  const selected = kind === "buy" ? state.selectedBuy : state.selectedRent;
  const priceField = kind === "buy" ? "total_price_vnd" : "rent_monthly_vnd";
  const sortKey = kind === "buy" ? state.buySort : state.rentSort;

  wrap.innerHTML = "";

  if (selected) {
    const summary = document.createElement("div");
    summary.className = "selected-summary";
    summary.innerHTML = `
      <div class="info">
        <div class="listing-name">${selected.project_name}</div>
        <div class="listing-meta">${buildCardMeta(selected, kind)}</div>
        <div class="listing-address">${buildAddressLine(selected)}</div>
      </div>`;
    const changeBtn = document.createElement("button");
    changeBtn.className = "btn-ghost btn-sm";
    changeBtn.textContent = "Change";
    changeBtn.addEventListener("click", () => {
      if (kind === "buy") state.selectedBuy = null; else state.selectedRent = null;
      state.result = null;
      document.getElementById("step4").style.display = "none";
      renderUnitColumn(kind);
      updateCalculateButton();
      updateAllPreviews();
    });
    summary.appendChild(changeBtn);
    wrap.appendChild(summary);
    return;
  }

  if (listings.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No units match this area and size. Try a different selection in Step 1.";
    wrap.appendChild(empty);
    return;
  }

  const list = document.createElement("div");
  list.className = "card-list";

  sortListings(listings, sortKey, priceField).forEach(item => {
    const card = document.createElement("div");
    card.className = "listing-card";
    card.innerHTML = `
      <div class="listing-name">${item.project_name}</div>
      <div class="listing-meta">${buildCardMeta(item, kind)}</div>
      <div class="listing-address">${buildAddressLine(item)}</div>`;
    card.addEventListener("click", () => {
      if (kind === "buy") state.selectedBuy = item; else state.selectedRent = item;
      state.result = null;
      document.getElementById("step4").style.display = "none";
      renderUnitColumn(kind);
      updateCalculateButton();
      updateAllPreviews();
    });
    list.appendChild(card);
  });

  wrap.appendChild(list);
}

document.getElementById("buy-sort").addEventListener("change", (e) => {
  state.buySort = e.target.value;
  renderUnitColumn("buy");
});
document.getElementById("rent-sort").addEventListener("change", (e) => {
  state.rentSort = e.target.value;
  renderUnitColumn("rent");
});

// ---------- STEP 3 — financial profile + Calculate (now a pure local call) ----------
function updateCalculateButton() {
  const btn = document.getElementById("calculate-btn");
  const hint = document.getElementById("calculate-hint");
  const ready = !!(state.selectedBuy && state.selectedRent);
  btn.disabled = !ready;
  hint.style.display = ready ? "none" : "block";
}

document.getElementById("calculate-btn").addEventListener("click", () => {
  clearError();

  const income1Raw = document.getElementById("income1").value;
  const income2Raw = document.getElementById("income2").value;
  const savingsRaw = document.getElementById("savings").value;
  const livingCostRaw = document.getElementById("living_cost").value;
  const existingDebtRaw = document.getElementById("existing_debt").value;
  const loanTermRaw = document.getElementById("loan_term_months").value;

  if (income1Raw === "" || income2Raw === "" || savingsRaw === "" || livingCostRaw === "") {
    showError("Please fill in Income 1, Income 2, Savings, and Minimum living cost.");
    return;
  }

  const income1M = Number(income1Raw);
  const income2M = Number(income2Raw);
  const savingsM = Number(savingsRaw);
  const livingCostM = Number(livingCostRaw);
  const existingDebtM = existingDebtRaw === "" ? 0 : Number(existingDebtRaw);
  const loanTermMonths = loanTermRaw === "" ? null : Number(loanTermRaw);

  const fields = { income1: income1M, income2: income2M, savings: savingsM, living_cost: livingCostM, existing_debt: existingDebtM };
  for (const [name, value] of Object.entries(fields)) {
    if (Number.isNaN(value)) { showError(`"${name}" is not a valid number.`); return; }
    if (value < 0) { showError(`"${name}" cannot be negative.`); return; }
  }
  if (income1M + income2M <= 0) {
    showError("Income 1 + Income 2 must be greater than 0 to calculate the safety margin.");
    return;
  }
  if (loanTermMonths !== null && (Number.isNaN(loanTermMonths) || loanTermMonths <= 0)) {
    showError("Loan term (months) must be a valid number greater than 0.");
    return;
  }

  // --- Locked decision #9: convert million VND -> VND ONCE, right here, before
  // running the calculation — same conversion point as the server-backed version,
  // just with no network hop in between. ---
  const income1 = income1M * 1_000_000;
  const income2 = income2M * 1_000_000;
  const savings = savingsM * 1_000_000;
  const livingCost = livingCostM * 1_000_000;
  const existingDebt = existingDebtM * 1_000_000;

  let data;
  try {
    data = evaluateBuyVsRent(
      state.selectedBuy, state.selectedRent,
      income1, income2, savings, livingCost, existingDebt,
      loanTermMonths, 1, FIN_ASSUMPTIONS
    );
    const actualLoanTermMonths = loanTermMonths || FIN_ASSUMPTIONS.Loan_term_months;
    data.net_worth_timeline = buildNetWorthTimeline(data.net_worth, actualLoanTermMonths);
  } catch (e) {
    showError("Something went wrong during the calculation (" + e.message + "). Please check your inputs and try again.");
    return;
  }

  state.result = data;
  document.getElementById("step4").style.display = "block";
  renderResults(data);
  updateAllPreviews();
  document.getElementById("step4").scrollIntoView({ behavior: "smooth", block: "start" });
});

// Shared result-card / decision-banner markup (used in Step 4 AND in the
// sticky/mobile preview rail — muc 2: "by step 04, shows both full BUY | RENT

function buildMarginBar(safetyMargin, minPct, isSafe) {
  const pct = Math.max(0, Math.min(100, safetyMargin * 100));
  const minPos = Math.max(0, Math.min(100, minPct * 100));
  return `
    <div class="margin-bar">
      <div class="margin-bar-track">
        <div class="margin-bar-fill${isSafe ? "" : " unsafe"}" style="width:${pct}%"></div>
        <div class="margin-bar-threshold" style="left:${minPos}%"></div>
      </div>
      <div class="margin-bar-caption">
        <span>Safety margin: ${formatPct(safetyMargin)}</span>
        <span>Min required: ${formatPct(minPct)}</span>
      </div>
    </div>`;
}

function buildResultCardHTML(kind, data, decision) {
  const label = kind === "buy" ? "Buy" : "Rent";
  let cardClass = "result-card";
  if (kind === "buy" && data.error) cardClass += " fail";
  else if (decision === kind.toUpperCase()) cardClass += " win" + (kind === "rent" ? " rent-win" : "");
  else if (decision === "NEITHER" && !(kind === "buy" && data.error)) cardClass += " fail";

  if (kind === "buy" && data.error) {
    return `<div class="${cardClass}"><h3>${label}</h3><div class="error-text">${data.error}</div></div>`;
  }

  const monthly = kind === "buy" ? data.monthly_repayment : data.monthly_rent;
  return `
    <div class="${cardClass}">
      <h3>${label}</h3>
      <div class="stat-line"><span class="stat-label">Monthly cost</span><span class="stat-value">${formatVND(monthly)}</span></div>
      <div class="stat-line"><span class="stat-label">Money left over</span><span class="stat-value">${formatVND(data.money_remaining)}</span></div>
      ${buildMarginBar(data.safety_margin, data.safety_margin_min_pct, data.is_safe)}
    </div>`;
}

function buildDecisionBannerHTML(decision, reason) {
  let cls = "fail", label = "🔴 NEITHER OPTION MEETS THE SAFETY THRESHOLD";
  if (decision === "BUY") { cls = "win-buy"; label = "🟢 RECOMMENDED: BUY"; }
  else if (decision === "RENT") { cls = "win-rent"; label = "🔵 RECOMMENDED: RENT"; }
  return `<div class="verdict ${cls}">${label}<span class="verdict-reason">${reason}</span></div>`;
}

function renderResults(data) {
  const area = document.getElementById("results-area");
  const breakEvenNote = data.net_worth.break_even_year != null
    ? `<p class="hint" style="margin:0 0 10px;">Break-even: Year ${data.net_worth.break_even_year} — the year BUY's net worth overtakes RENT's (or vice versa).</p>`
    : `<p class="hint" style="margin:0 0 10px;">BUY and RENT never cross over this loan term — one option stays ahead the whole time.</p>`;

  area.innerHTML = `
    <div class="chart-card">
      <h3>Net worth over time</h3>

      <div class="chart-wrap"><canvas id="net-worth-chart"></canvas></div>

        <span class="icon">⚠️</span>
        <span>This chart assumes property prices grow at a flat 12%/year and invested cash returns 6%/year for the
        <em>entire</em> loan term. These are simplified demo assumptions based on short-term market data (Ministry of
        Construction, Dec 2025) — real estate cycles historically include flat and declining years, so treat this
        chart as illustrative, not a 30-year forecast.</span>
      </div>
    </div>
    <div class="results-cards">
      ${buildResultCardHTML("buy", data.buy, data.decision)}
      ${buildResultCardHTML("rent", data.rent, data.decision)}

  drawNetWorthChart(data.net_worth_timeline, data.net_worth.break_even_year);

// ============================================================
// Muc 6: Net worth chart (Chart.js via CDN) — 2 lines BUY/RENT by year, custom
// plugin draws the break-even vertical marker (no extra CDN lib needed). This
// is the ONE feature on this page that needs internet (to fetch Chart.js) —
// everything else on this page works fully offline.
// ============================================================
const breakEvenLinePlugin = {
  id: "breakEvenLine",
  afterDraw(chart) {
    const year = chart.$breakEvenYear;
    if (year == null) return;
    const idx = chart.data.labels.indexOf(year);
    if (idx === -1) return;
    const xScale = chart.scales.x;
    const yScale = chart.scales.y;
    const x = xScale.getPixelForValue(idx);
    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "#55645C";
    ctx.lineWidth = 1.5;
    ctx.moveTo(x, yScale.top);
    ctx.lineTo(x, yScale.bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#1C2B24";
    ctx.font = "600 11px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`Break-even: Year ${year}`, x, yScale.top - 6);
    ctx.restore();
  },
};
let breakEvenPluginRegistered = false;

// drawNetWorthChart() can be called before Chart.js has finished loading (the
// CDN fetch happens in the background — see window.chartLoadPromise in <head>),
// so it shows a temporary "Loading…" note and only builds the actual chart once
// that promise settles. If all 3 CDN mirrors failed, it offers a Retry button
// that re-runs the whole fallback chain in case the connection was temporary.
function drawNetWorthChart(timeline, breakEvenYear) {
  const canvas = document.getElementById("net-worth-chart");
  if (!canvas) return;

  if (window.Chart) {
    renderNetWorthChartNow(canvas, timeline, breakEvenYear);
    return;
  }

  canvas.parentElement.insertAdjacentHTML(
    "beforeend",
    '<p class="hint" id="chart-load-status">Loading chart…</p>'
  );

  window.chartLoadPromise.then((ok) => {
    // The canvas may have been replaced (Change/Recalculate) by the time this
    // resolves — only touch the DOM if this exact canvas is still the live one.
    if (document.getElementById("net-worth-chart") !== canvas) return;
    const status = document.getElementById("chart-load-status");
    if (status) status.remove();

    if (ok && window.Chart) {
      renderNetWorthChartNow(canvas, timeline, breakEvenYear);
      return;
    }

    canvas.parentElement.insertAdjacentHTML(
      "beforeend",
      '<p class="hint">Chart.js could not be loaded from any source (no internet connection, or it is being blocked) — the chart above is blank, but all numbers and cards below are still fully calculated and correct. ' +
      '<button type="button" id="retry-chart-btn" class="btn-ghost btn-sm" style="margin-left:6px;">Retry</button></p>'
    );
    document.getElementById("retry-chart-btn").addEventListener("click", () => {
      document.getElementById("retry-chart-btn").closest("p").remove();
      window.chartLoadPromise = window.loadChartJs();
      drawNetWorthChart(timeline, breakEvenYear);
    });
  });
}

function renderNetWorthChartNow(canvas, timeline, breakEvenYear) {
  if (!breakEvenPluginRegistered) {
    Chart.register(breakEvenLinePlugin);
    breakEvenPluginRegistered = true;
  }

  const labels = timeline.map(p => p.year);
  const buyData = timeline.map(p => p.net_worth_buy);
  const rentData = timeline.map(p => p.net_worth_rent);

  if (netWorthChart) { netWorthChart.destroy(); netWorthChart = null; }

  try {
    netWorthChart = new Chart(canvas.getContext("2d"), {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "Net worth — BUY",
            data: buyData,
            borderColor: "#1F7A5C",
            backgroundColor: "#1F7A5C",
            tension: 0.15,
            pointRadius: 2,
          },
          {
            label: "Net worth — RENT",
            data: rentData,
            borderColor: "#2A5C8A",
            backgroundColor: "#2A5C8A",
            tension: 0.15,
            pointRadius: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 12 } } },
          tooltip: {
            callbacks: {
              label: (ctx) => `${ctx.dataset.label}: ${formatVND(ctx.parsed.y)}`,
              title: (items) => `Year ${items[0].label}`,
            },
          },
        },
        scales: {
          x: { title: { display: true, text: "Year" } },
          y: {
            title: { display: true, text: "Net worth (VND)" },
            ticks: { callback: (v) => formatBillionShort(v) },
          },
        },
      },
      // NOTE: breakEvenLinePlugin is registered globally (once, via the
      // breakEvenPluginRegistered guard above) and must NOT also be listed
      // here — Chart.js v4 throws on a duplicate plugin id when the same
      // plugin is registered both globally and per-chart.
    });
    netWorthChart.$breakEvenYear = breakEvenYear;
    netWorthChart.update();
  } catch (e) {
    canvas.parentElement.insertAdjacentHTML(
      "beforeend",
      '<p class="hint">The chart could not be rendered (' + e.message + '). All numbers and cards below are still fully calculated and correct.</p>'
    );
  }
}

// ============================================================
// Sticky / mobile result-preview rail (muc 2: fills in gradually as steps are
// completed; on mobile it appears inline below each step instead of staying
// pinned — see CSS .desktop-only / .mobile-only).
// ============================================================
function renderPreviewInto(el) {
  if (!state.ward_old) {
    el.innerHTML = `<h4>Your comparison</h4><p class="preview-placeholder">Complete the steps to see your BUY vs RENT comparison here.</p>`;
    return;
  }

  let html = `<h4>Your comparison</h4>`;
  html += `<div class="preview-block"><div class="preview-label">Area &amp; size</div><div class="preview-value">${state.ward_old} · ${state.size_band}</div></div>`;

  if (state.selectedBuy && state.selectedRent) {
    html += `<div class="mini-card"><div class="tag">Buy</div><div class="name">${state.selectedBuy.project_name}</div><div class="price">${formatBillionVND(state.selectedBuy.total_price_vnd)}</div></div>`;
    html += `<div class="mini-card"><div class="tag">Rent</div><div class="name">${state.selectedRent.project_name}</div><div class="price">${formatMillionPerMonth(state.selectedRent.rent_monthly_vnd)}</div></div>`;
  } else {
    html += `<p class="preview-hint">Choose a BUY and a RENT unit in Step 2.</p>`;
  }

  if (state.result) {
    html += `<div style="margin-top:14px;">`;
    html += buildResultCardHTML("buy", state.result.buy, state.result.decision);
    html += buildResultCardHTML("rent", state.result.rent, state.result.decision);
    html += buildDecisionBannerHTML(state.result.decision, state.result.reason);
    html += `</div>`;
  } else if (state.selectedBuy && state.selectedRent) {
    html += `<p class="preview-hint">Fill in Step 3 and click Calculate to see full results.</p>`;
  }

  el.innerHTML = html;
}

function updateAllPreviews() {
  document.querySelectorAll(".result-preview-mount").forEach(renderPreviewInto);
}

// ============================================================
// Init — synchronous now (no fetch, no server round-trip to wait on).
// ============================================================
(function init() {
  try {
    loadWards();
    loadListings();
    updateCalculateButton();
    updateAllPreviews();
  } catch (e) {
    showError("Could not initialize the page (" + e.message + "). Please reload this page.");
  }
})();
</script>
